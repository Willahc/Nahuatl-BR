name: Validate Gates 3, 4, 5 and 6

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Validate corpus and derived data without writes
        run: python scripts/validate_gate3.py --check
      - name: Validate Gate 4 phonological artifacts
        run: python scripts/validate_gate4.py --check
      - name: Validate Gate 5 ingestion pipeline and fixtures
        run: python scripts/validate_gate5.py --check
      - name: Validate Gate 6 canonical corpus checkpoint
        run: python scripts/validate_gate6.py --checkpoint 2
      - name: Require reproducible research preview data
        run: python scripts/build_preview_data.py --check
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - name: Install preview dependencies (locked)
        run: npm ci
        working-directory: preview
      - name: Test canonical preview search
        run: npm test
        working-directory: preview
      - name: Audit publication security
        run: python scripts/audit_publication.py
      - name: Build research preview
        run: npm run build
        working-directory: preview
      - name: Audit exact Pages artifact
        run: python scripts/audit_preview_dist.py
      - name: Require unchanged working tree
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
