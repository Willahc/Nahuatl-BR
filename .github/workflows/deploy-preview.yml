name: Deploy Research Preview

on:
  workflow_run:
    workflows: ['Validate Gates 3, 4 and 5']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: preview
      - run: npm test
        working-directory: preview
      - run: npm run build
        working-directory: preview
      - name: Audit exact publication artifact
        run: python scripts/audit_preview_dist.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: preview/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
